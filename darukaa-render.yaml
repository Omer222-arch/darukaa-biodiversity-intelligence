services:
  - type: web
    name: darukaa-biodiversity-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"
      - key: TOP_K
        value: "5"
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
